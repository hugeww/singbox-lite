name: build

# Builds only run when asked for:
#   * manually (Actions -> build -> Run workflow), and
#   * when a version tag (v*) is pushed, which also publishes a GitHub release.
# A normal push to main never builds.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.1 (empty: next patch after the latest tag)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: |
          set -eu
          pkg=$(sed -n 's/^PKG_VERSION:=//p' singbox-lite/Makefile | head -n 1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag=${GITHUB_REF_NAME#v}
            if [ "$tag" != "$pkg" ]; then
              echo "tag v$tag does not match PKG_VERSION $pkg" >&2
              echo "run scripts/bump-version.sh $tag, commit the result, then tag again" >&2
              exit 1
            fi
            version=$tag
          else
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)
              base=$(printf '%s\n%s\n' "$pkg" "$latest" | sed '/^$/d' | sort -V | tail -n 1)
              version=$(printf '%s' "$base" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build version: $version"

  test:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev gcc make git nodejs

      - name: Build host ucode
        run: |
          git clone --depth 1 https://github.com/jow-/ucode /tmp/ucode
          cmake -S /tmp/ucode -B /tmp/ucode/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/ucode-install \
            -DUCI_SUPPORT=OFF -DUBUS_SUPPORT=OFF -DULOOP_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DZLIB_SUPPORT=OFF
          cmake --build /tmp/ucode/build -j"$(nproc)"
          cmake --install /tmp/ucode/build

      - name: Backend tests
        run: |
          export LD_LIBRARY_PATH="/tmp/ucode-install/lib:${LD_LIBRARY_PATH:-}"
          export UCODE_BIN=/tmp/ucode-install/bin/ucode
          export SINGBOX_LITE_LIB="$PWD/singbox-lite/files/usr/share/singbox-lite"
          export SINGBOX_LITE_ETC=/tmp/singbox-lite-test
          export SINGBOX_LITE_TESTDIR="$PWD"
          mkdir -p /tmp/sbxmods
          for m in common config links nodes rulesets subs generator core releases plugin panel; do
            ln -sf "$SINGBOX_LITE_LIB/ucode/$m.uc" "/tmp/sbxmods/sbx_$m.uc"
          done
          "$UCODE_BIN" -L /tmp/sbxmods tests/run.uc

      - name: JS syntax
        run: |
          find luci-app-singbox-lite/htdocs -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: ucode compile checks
        run: |
          export LD_LIBRARY_PATH="/tmp/ucode-install/lib:${LD_LIBRARY_PATH:-}"
          for f in singbox-lite/files/usr/share/singbox-lite/ucode/*.uc; do
            /tmp/ucode-install/bin/ucode -cmodule -L /tmp/sbxmods -o /tmp/out.uc "$f"
          done
          /tmp/ucode-install/bin/ucode -cmodule \
            -L /tmp/sbxmods \
            -o /tmp/out.uc singbox-lite/files/usr/share/singbox-lite/cli.uc
          /tmp/ucode-install/bin/ucode -c \
            -o /tmp/out.uc luci-app-singbox-lite/root/usr/share/rpcd/ucode/luci.singbox_lite

  build:
    name: ${{ matrix.arch }}-${{ matrix.branch }}
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            branch: openwrt-25.12
          - arch: aarch64_cortex-a53
            branch: openwrt-25.12

    steps:
      - uses: actions/checkout@v4

      - name: Set package version
        run: |
          sh scripts/bump-version.sh "${{ needs.version.outputs.version }}"

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: singbox_lite
          PACKAGES: singbox-lite luci-app-singbox-lite
          NO_REFRESH_CHECK: true
          # Scripts are kept shfmt-clean locally; the action's check trips on
          # mode-only diffs in its /feed checkout (no *.init files here).
          NO_SHFMT_CHECK: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singbox-lite-${{ matrix.arch }}-${{ matrix.branch }}
          path: bin/packages/${{ matrix.arch }}/singbox_lite/*.apk
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package tarballs
        run: |
          mkdir -p release
          for d in dist/*/; do
            name=$(basename "$d")
            tar -czf "release/${name}.tar.gz" -C "$d" .
          done
          ls -l release

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
